baseURL = "https://madeso.github.io/"
title = "Gustav Jansson"
theme = "expose"
pygmentsUseClasses=true
# disqusshortname = "madesopage"

[Params]
LongDateFormat = "Monday, 2 January 2006 at 15:04"
ShortDateFormat = "2 January 2006"
latestpostcount = 3
latestdevlogcount = 3
posts_navigation = true
sharebuttons = false
highlightjs = true
InfiniteScroll = false

[menus]
  [[menus.main]]
    name = 'home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'devlog'
    pageRef = '/devlog'
    weight = 20

  [[menus.main]]
    name = 'blog'
    pageRef = '/blog'
    weight = 30

  [[menus.main]]
    name = 'project'
    pageRef = '/project'
    weight = 40

  [[menus.main]]
    name = 'cv'
    pageRef = '/cv'
    weight = 50

  [[menus.main]]
    name = 'about'
    pageRef = '/about'
    weight = 60

[markup]
  [markup.tableOfContents]
    endLevel = 2
    ordered = true
    startLevel = 2


[Params.social]
Twitter = "sirGustav"
Keybase = "madeso"
Github = "madeso"
Mastodon = "https://mastodon.gamedev.place/@madeso"
Tumblr = "https://imadesome.tumblr.com/"
Cohost = "https://cohost.org/madeso"


[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^vim$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']

  [security.funcs]
    getenv = ['^HUGO_']

  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']


